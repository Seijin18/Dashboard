services:
  backend:
    build: 
      context: ./backend
    container_name: kannondo-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - WATCHFILES_FORCE_POLLING=true

  frontend:
    build:
      context: ./frontend
    container_name: kannondo-frontend
    ports:
      - "3001:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - FASTAPI_URL=http://backend:8000
      - NEXT_PUBLIC_FASTAPI_URL=http://localhost:8000
    command: sh -c "npm install && npm run dev"
    depends_on:
      - backend

volumes:
  frontend_node_modules: