services:
  backend:
    build: 
      context: ./backend
    container_name: kannondo-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - WATCHFILES_FORCE_POLLING=true

  frontend:
    build:
      context: ./frontend
    container_name: kannondo-frontend
    ports:
      - "3001:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - FASTAPI_URL=http://backend:8000
    depends_on:
      - backend